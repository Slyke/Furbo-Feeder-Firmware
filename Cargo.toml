[package]
name = "furbo-local"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local, authenticated Furbo2 control, media, and MQTT service"
repository = "https://github.com/Slyke/Furbo-Feeder-Firmware"

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
tz-rs = "0.7"
futures-util = "0.3"
hmac = "0.12"
libc = "0.2"
pbkdf2 = "0.12"
sha1 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "process", "time", "io-util", "sync", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["limit", "set-header"] }
webpki-roots = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
rcgen = "0.14.10"
